<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winamp</title>
<style>
  :root {
    --bg: #000;
    --panel: #20202c;
    --panel-2: #2c2c3c;
    --line: #4a4a5e;
    --text: #e8e8f0;
    --dim: #9a9ab0;
    --accent: #00e000;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    font: 18px/1.3 system-ui, "DejaVu Sans", sans-serif; color: var(--text);
    -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  #stage { position: absolute; left: 0; top: 0; }
  /* Skins are pixel art: scale them up as hard pixels, not smoothed */
  #webamp, #webamp * { image-rendering: pixelated; }
  /* Bottom left: the space under the main and equalizer windows */
  #status { position: fixed; left: 16px; bottom: 76px; max-width: 40vw; color: var(--dim);
    font-size: 15px; z-index: 1000; }
  #status.err { color: #ff7070; }
  #buttons { position: fixed; left: 16px; bottom: 16px; display: flex; gap: 12px; z-index: 1000; }
  #buttons button { font-size: 22px; padding: 10px 24px; }
  #homebtn { display: none; }
  button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 16px; }
  button:active { background: var(--line); }

  /* Full-screen visualizer: Milkdrop rendered small and scaled up smoothly;
     bars as big hard pixels. Tap shows the controls strip. */
  #fullvis { position: fixed; inset: 0; background: #000; display: none; z-index: 50000; }
  #fullvis.open { display: block; }
  #fvcanvas, #fvbars { position: absolute; inset: 0; width: 100%; height: 100%; }
  #fvbars { image-rendering: pixelated; }
  #fvfps { position: absolute; right: 16px; top: 12px; font-size: 18px; color: #fff8; }
  #fvbar { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 20px 20px;
    background: linear-gradient(transparent, #000c 40%); opacity: 0; pointer-events: none; transition: opacity .3s; }
  #fvbar.show { opacity: 1; pointer-events: auto; }
  #fvtitle { font-size: 26px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 8px; }
  #fvnote { color: #ff9090; font-size: 18px; margin-bottom: 8px; }
  #fvnote:empty { display: none; }
  .fvrow { display: flex; align-items: center; gap: 12px; }
  .fvrow button { font-size: 22px; padding: 12px 22px; }
  #fvname { flex: 1; color: var(--dim); font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Touch layer over the playlist (touch.js): room for the ≡ handle and + */
  #webamp .playlist-track-titles .track-cell { padding-left: 13px; padding-right: 13px; }
  #pltouch { position: fixed; display: none; z-index: 20; touch-action: none; overflow: hidden; }
  .plrow { position: absolute; left: 0; right: 0; }
  .plhandle, .pladd { position: absolute; top: 0; bottom: 0; display: flex; align-items: center;
    justify-content: center; opacity: .55; font-family: system-ui, sans-serif; }
  .plhandle { left: 0; }
  .plrow.dragging { background: rgba(255,255,255,.12); }
  .plrow.dragging .plhandle { opacity: 1; }
  .plmarker { position: absolute; left: 0; right: 0; height: 4px; background: currentColor; display: none;
    box-shadow: 0 0 6px currentColor; }

  /* Settings */
  #settings .box { width: min(1100px, 96vw); max-height: 94vh; }
  #settings .box header .title, .sheet .title { font-size: 22px; padding: 4px; }
  #setbody { overflow-y: auto; padding: 4px 16px 16px; touch-action: pan-y; overscroll-behavior: contain; }
  #setbody section { border-bottom: 1px solid var(--line); padding: 8px 0 12px; }
  #setbody h2 { font-size: 18px; color: var(--accent); margin: 8px 0; font-weight: 600; }
  .srow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 0; }
  .slabel { width: 210px; color: var(--dim); }
  .slabel:empty { display: none; }
  .srow button { padding: 10px 18px; }
  .seg { display: flex; flex-wrap: wrap; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button.on { background: #305030; border-color: var(--accent); position: relative; }
  .range { width: 340px; height: 36px; accent-color: var(--accent); }
  .val { min-width: 110px; }
  .hint { color: var(--dim); font-size: 15px; margin: 4px 0; }
  .hint.err { color: #ff8080; }
  button.danger, li.danger .name { color: #ff9090; }

  /* List sheets (Add to playlist, track menu, presets) */
  .sheet .box { width: min(760px, 94vw); }
  .box ul { touch-action: pan-y; overscroll-behavior: contain; }
  #toast { position: fixed; left: 50%; top: 24px; transform: translateX(-50%); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 12px 24px; z-index: 200000; opacity: 0;
    transition: opacity .3s; pointer-events: none; font-size: 20px; }
  #toast.show { opacity: 1; }

  /* Music Assistant library picker and text prompts */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
    align-items: center; justify-content: center; z-index: 100000; }
  .modal.open { display: flex; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    width: min(900px, 94vw); max-height: 88vh; display: flex; flex-direction: column; }
  .box header { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .box header .tab.on { background: #305030; border-color: var(--accent); }
  .box header input { flex: 1; min-width: 160px; font: inherit; padding: 8px; color: var(--text);
    background: #111; border: 1px solid var(--line); border-radius: 6px; }
  .box ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; }
  .box li { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #333344; }
  .box li .name { flex: 1; }
  .box li .sub { color: var(--dim); font-size: 15px; }
  .box li:active { background: var(--panel-2); }
  .box footer { padding: 10px 12px; display: flex; gap: 8px; justify-content: flex-end; }
  .box .empty { padding: 20px; color: var(--dim); }
  #ask .box { width: min(640px, 94vw); }
  #ask p { margin: 16px 16px 8px; }
  #ask input { margin: 0 16px; font: inherit; padding: 10px; color: var(--text); background: #111;
    border: 1px solid var(--line); border-radius: 6px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="status">Connecting…</div>
<div id="buttons">
  <button id="libbtn" type="button">Library</button>
  <button id="visbtn" type="button">Visualizer</button>
  <button id="setbtn" type="button">Settings</button>
  <button id="homebtn" type="button">Dashboard</button>
</div>

<div id="fullvis">
  <canvas id="fvcanvas"></canvas>
  <canvas id="fvbars"></canvas>
  <div id="fvfps"></div>
  <div id="fvbar">
    <div id="fvtitle"></div>
    <div id="fvnote"></div>
    <div class="fvrow">
      <button id="fvprev" type="button">◀ Prev</button>
      <div id="fvname"></div>
      <button id="fvnext" type="button">Next ▶</button>
      <button id="fvmode" type="button">Milkdrop</button>
      <button id="fvclose" type="button">Close ✕</button>
    </div>
  </div>
</div>

<div class="modal" id="settings">
  <div class="box">
    <header><div class="title">Settings</div></header>
    <div id="setbody"></div>
    <footer><button id="setclose" type="button">Done</button></footer>
  </div>
</div>

<div class="modal" id="lib">
  <div class="box">
    <header>
      <button class="tab" data-kind="playlists" type="button">Playlists</button>
      <button class="tab" data-kind="albums" type="button">Albums</button>
      <button class="tab" data-kind="radios" type="button">Radio</button>
      <input id="libsearch" type="text" placeholder="Search" autocomplete="off">
    </header>
    <ul id="liblist"></ul>
    <footer><button id="libclose" type="button">Close</button></footer>
  </div>
</div>

<div class="modal" id="ask">
  <div class="box">
    <p id="askq"></p>
    <input id="aska" type="text" autocomplete="off">
    <footer><button id="askno" type="button">Cancel</button><button id="askok" type="button">OK</button></footer>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
